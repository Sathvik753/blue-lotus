# Service-specific build and deploy config is managed per-service in the Railway UI.
#
# API service (blue-lotus):
#   Build:         Dockerfile.api
#   Start command: sh -c 'uvicorn api.main:app --host 0.0.0.0 --port $PORT'
#   Healthcheck:   /health
#
# Frontend service (easygoing-nature):
#   Build:         Dockerfile.frontend
#   Start command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
#   Healthcheck:   /
